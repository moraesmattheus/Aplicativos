# Configuração do Cloudflare Worker.
# A chave do Gemini NÃO fica aqui — é um secret: `npx wrangler secret put GEMINI_API_KEY`.
name = "radar-vagas-backend"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Modelo do Gemini. Alias "latest" p/ não quebrar quando o Google deprecia versões
# (gemini-2.0-flash e gemini-2.5-flash já deram 404 p/ chaves novas).
[vars]
GEMINI_MODEL = "gemini-flash-latest"
