<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reuniões · Omnivix</title>
<link rel="stylesheet" href="estilo.css">
<script src="foco/tema.js"></script>
<style>
  body { display: grid; grid-template-columns: 320px 1fr; height: 100vh; overflow: hidden; }

  /* Barra lateral: um cartão com raio de fora = raio de dentro + espaço (cantos concêntricos). */
  aside { display: flex; flex-direction: column; gap: 12px; padding: 12px; min-height: 0; }
  .painel { background: var(--superficie); border-radius: var(--raio-externo); box-shadow: var(--anel); padding: 6px; min-height: 0; display: flex; flex-direction: column; }
  .topo { display: flex; align-items: center; gap: 10px; padding: 8px 8px 4px 10px; }
  .topo h1 { margin: 0; flex: 1; }
  #lista { overflow-y: auto; padding: 4px 0 2px; overscroll-behavior: contain; }
  #lista button.item {
    display: block; width: 100%; text-align: left; margin-top: 4px; padding: 10px 12px;
    background: transparent; box-shadow: none; border-radius: var(--raio-interno);
    -webkit-backdrop-filter: none; backdrop-filter: none; font-weight: 400;
  }
  #lista button.item::before { display: none; }
  /* itens da lista e nomes de falantes não "respiram" ao passar o mouse (só os botões de verdade) */
  #lista button.item:hover, button.falante:hover:not(:disabled):not(:active) { animation: none; }
  #lista button.item:hover { background: color-mix(in srgb, var(--texto) 8%, transparent); }
  #lista button.item.ativo { background: color-mix(in srgb, var(--destaque) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--destaque) 45%, transparent); }
  #lista small { display: block; color: var(--suave); margin-top: 2px; font-variant-numeric: tabular-nums; }

  /* Botão grande de gravar/parar (só aparece no app de bandeja). Os estados trocam com transição suave. */
  .gravar { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 46px; font-weight: 500; font-size: 14px; letter-spacing: 0.02em;
    border-radius: var(--raio-externo); }
  .gravar[hidden] { display: none; }
  .gravar-ponto { width: 12px; height: 12px; border-radius: 50%; background: var(--perigo); flex: none; transition: transform var(--medio) var(--curva), border-radius var(--medio) var(--curva); }
  .gravar.gravando {
    color: #fff; text-shadow: 0 1px 2px rgb(0 0 0 / 0.5), 0 0 10px rgb(0 0 0 / 0.25);
    background:
      linear-gradient(180deg, rgb(255 255 255 / 0.03) 0%, rgb(255 255 255 / 0) 55%),
      linear-gradient(180deg, color-mix(in srgb, var(--perigo) 80%, transparent), color-mix(in srgb, var(--perigo) 62%, transparent));
    box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.07), inset 0 1px 0 rgb(255 255 255 / 0.06), inset 0 -12px 16px -10px rgb(0 0 0 / 0.32), 0 8px 20px -14px rgb(0 0 0 / 0.9);
  }
  .gravar.gravando .gravar-ponto { background: #fff; border-radius: 3px; transform: scale(0.85); }  /* vira um quadrado: "parar" */
  .gravar.ocupado .gravar-ponto { background: transparent; border: 2px solid var(--suave); border-top-color: transparent; border-radius: 50%; animation: gira 700ms linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  main { padding: 24px 32px 64px 12px; overflow-y: auto; min-height: 0; overscroll-behavior: contain; view-transition-name: detalhe; }
  main > * { max-width: 820px; }
  .titulo { font-size: 22px; font-weight: 700; width: 100%; border: 1px solid transparent; background: transparent; padding: 4px 8px; margin-left: -8px; }
  .titulo:hover, .titulo:focus { border-color: var(--borda); }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  ul { padding-left: 20px; margin: 4px 0; }
  li.feito { text-decoration: line-through; color: var(--suave); }
  .tag { display: inline-block; font-size: 12px; background: var(--superficie); box-shadow: var(--anel); border-radius: 999px; padding: 2px 10px; color: var(--suave); }
  .fala { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
  .hora { color: var(--suave); font-variant-numeric: tabular-nums; font-size: 12px; flex: none; }
  .falante { flex: none; border: 0; background: transparent; padding: 0; min-height: 0; box-shadow: none; font-weight: 700; cursor: pointer; border-radius: 4px; overflow: visible; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .falante::before { display: none; }
  .falante:hover:not(:disabled) { text-decoration: underline; background: transparent; box-shadow: none; }
  pre { white-space: pre-wrap; background: var(--superficie); border-radius: var(--raio-interno); padding: 12px; font: 13px/1.6 system-ui, sans-serif; }
  audio { width: 100%; margin-top: 8px; }
  details { background: var(--superficie); border-radius: var(--raio-externo); box-shadow: var(--anel); padding: 12px 16px; margin-top: 16px; }
  summary { cursor: pointer; font-weight: 600; }

  /* Painel "ao vivo": um cartão com anel colorido e o relógio com números de largura fixa (não "pula"). */
  .ao-vivo { border-radius: var(--raio-externo); padding: 14px 16px; margin: 12px 0; background: var(--superficie); box-shadow: 0 0 0 1px color-mix(in srgb, var(--destaque) 55%, transparent), var(--elevacao); }
  .ao-vivo-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tempo-vivo { margin-left: auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ponto-rec { width: 11px; height: 11px; border-radius: 50%; background: var(--perigo); animation: piscar 1.4s ease-in-out infinite; }
  @keyframes piscar { 50% { opacity: 0.3; } }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .ao-vivo h3 { margin: 12px 0 4px; font-size: 13px; color: var(--suave); }

  /* Troca entre reuniões: só o painel da direita faz a transição (o resto da tela fica parado). */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  ::view-transition-group(detalhe) { animation-duration: var(--medio); animation-timing-function: var(--curva); }
  ::view-transition-old(detalhe) { animation-duration: 150ms; }

  @media (max-width: 720px) { body { grid-template-columns: 1fr; height: auto; overflow: auto; } main { padding: 12px; overflow: visible; } }
</style>
<body>
  <aside>
    <button id="btn-gravar" class="gravar" type="button" hidden aria-live="polite">
      <span class="gravar-ponto" aria-hidden="true"></span><span class="gravar-texto">Gravar agora</span>
    </button>
    <div class="painel">
      <div class="topo"><h1>Reuniões</h1></div>
      <div id="lista"></div>
    </div>
  </aside>
  <main id="detalhe"></main>
  <script type="module" src="reunioes.js"></script>
</body>
</html>
