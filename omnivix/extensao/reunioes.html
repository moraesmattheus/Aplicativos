<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Reuniões · Omnivix</title>
<link rel="stylesheet" href="estilo.css">
<script src="foco/tema.js"></script>
<style>
  body { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--borda); padding: 16px; background: var(--superficie); overflow: auto; }
  aside button.item { display: block; width: 100%; text-align: left; margin-top: 8px; background: var(--fundo); }
  aside button.item.ativo { border-color: var(--destaque); }
  aside small { display: block; color: var(--suave); }
  main { padding: 24px 32px 64px; max-width: 860px; }
  .titulo { font-size: 22px; font-weight: 700; width: 100%; border: 1px solid transparent; background: transparent; padding: 4px 8px; margin-left: -8px; }
  .titulo:hover, .titulo:focus { border-color: var(--borda); }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  ul { padding-left: 20px; margin: 4px 0; }
  li.feito { text-decoration: line-through; color: var(--suave); }
  .tag { display: inline-block; font-size: 12px; background: var(--superficie); border-radius: 10px; padding: 0 8px; color: var(--suave); }
  .fala { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
  .hora { color: var(--suave); font-variant-numeric: tabular-nums; font-size: 12px; flex: none; }
  .falante { flex: none; border: 0; background: transparent; padding: 0; font-weight: 700; cursor: pointer; }
  .falante:hover { text-decoration: underline; }
  pre { white-space: pre-wrap; background: var(--superficie); border-radius: 8px; padding: 12px; font: 13px/1.6 system-ui, sans-serif; }
  audio { width: 100%; margin-top: 8px; }
  .ao-vivo { border: 1px solid var(--destaque); border-radius: var(--raio); padding: 14px 16px; margin: 12px 0; background: var(--superficie); }
  .ao-vivo-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .tempo-vivo { margin-left: auto; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ponto-rec { width: 11px; height: 11px; border-radius: 50%; background: var(--perigo); animation: piscar 1.2s infinite; }
  @keyframes piscar { 50% { opacity: .25; } }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .ao-vivo h3 { margin: 12px 0 4px; font-size: 13px; color: var(--suave); }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid var(--borda); } }
</style>
<body>
  <aside>
    <h1>📄 Reuniões</h1>
    <div id="lista"></div>
  </aside>
  <main id="detalhe"></main>
  <script type="module" src="reunioes.js"></script>
</body>
</html>
