<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Omnivix</title>
<link rel="stylesheet" href="estilo.css">
<script src="foco/tema.js"></script>
<style>
  body { width: min(340px, 100%); padding: 16px; } /* 340px no popup, ocupa o painel lateral */
  #tela > * + * { margin-top: 10px; }
  .linha { display: flex; gap: 8px; }
  .linha > button { flex: 1; }
  .tempo { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ponto { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--perigo); margin-right: 8px; animation: piscar 1.2s infinite; }
  @keyframes piscar { 50% { opacity: .25; } }
  #trecho { font-size: 13px; max-height: 96px; overflow: auto; background: var(--superficie); border-radius: 8px; padding: 8px; }
</style>
<body>
  <div id="tela"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
